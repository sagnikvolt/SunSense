AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SunSense - rooftop solar sizing & payback API (Lambda + HTTP API + S3 cache)

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://sunsense.sagniknath.in,https://sagnikvolt.github.io,http://localhost:8000"
    Description: Web origins allowed to call the API (add your Amplify URL here)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 28
    MemorySize: 256
    Architectures: [arm64]

Resources:
  IrradianceCache:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules: [{Id: expire-cache, Status: Enabled, ExpirationInDays: 365}]

  IrradianceCachePolicy:              # refuse any non-HTTPS access to the bucket
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref IrradianceCache
      PolicyDocument:
        Statement:
          - Sid: TLSOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt IrradianceCache.Arn
              - !Sub "${IrradianceCache.Arn}/*"
            Condition: {Bool: {"aws:SecureTransport": "false"}}

  CalculateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          CACHE_BUCKET: !Ref IrradianceCache
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
      Policies:                        # least privilege: read/write cache objects only
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${IrradianceCache.Arn}/*"
      Events:
        Calculate:
          Type: HttpApi
          Properties:
            ApiId: !Ref SunSenseApi
            Path: /calculate
            Method: POST
        Lab:
          Type: HttpApi
          Properties:
            ApiId: !Ref SunSenseApi
            Path: /pvgis
            Method: POST

  CalculateLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CalculateFunction}"
      RetentionInDays: 14

  SunSenseApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:            # caps abuse and protects the free tier
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [Content-Type]
        MaxAge: 600

Outputs:
  ApiUrl:
    Description: POST your JSON here
    Value: !Sub "https://${SunSenseApi}.execute-api.${AWS::Region}.amazonaws.com/calculate"
  CacheBucket:
    Value: !Ref IrradianceCache
